name: Synchroniser l’image historique Remix
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: miroir-remix
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Copier sans reconstruire
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: python3 mirror.py
